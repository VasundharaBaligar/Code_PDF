<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyperscaleES Explorer</title>
<link rel="stylesheet" href="/vendor/highlight-theme.css">
<link rel="stylesheet" href="/css/pygments.css">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="layout">
  <aside class="repo-pane">
    <header class="repo-header">
      <svg class="repo-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1H4.5a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/></svg>
      <nav class="repo-breadcrumb" id="repo-breadcrumb"><span class="muted">Loading repo…</span></nav>
      <span class="repo-branch-badge" id="repo-branch"></span>
    </header>
    <div class="repo-body" id="repo-body">
      <div class="file-table" id="file-table">
        <p class="muted" style="padding:12px;">Loading files…</p>
      </div>
      <div class="content-section">
        <div class="content-path" id="content-path">README.org</div>
        <div class="content-view" id="content-view">
          <p class="muted">Loading README…</p>
        </div>
      </div>
    </div>
  </aside>

  <main class="chat-pane">
    <header class="chat-header">
      <div class="chat-title">HyperscaleES Assistant</div>
      <div class="chat-subtitle">Ask anything about this repo — answered locally and for free, via Ollama.</div>
    </header>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-message assistant" id="initial-greeting">
        <div class="bubble">
          Hi! Ask me anything about the HyperscaleES repo — how to install it, what a
          file does, or how to fix an error you're hitting.
        </div>
      </div>
    </div>
    <form class="chat-input-row" id="chat-form">
      <textarea id="chat-input" placeholder="Ask about this repo…" rows="1"></textarea>
      <button type="submit" id="chat-send">Send</button>
    </form>
  </main>
</div>

<script src="/vendor/markdown-it.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/js/repoBrowser.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
