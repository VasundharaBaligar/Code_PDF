services:
  - type: web
    name: hyperscalees-explorer
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/ingest_repo.py && python scripts/build_index.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
