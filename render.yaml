services:
  - type: web
    name: hyperscalees-explorer
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/ingest_repo.py && python scripts/ingest_paper.py && python scripts/build_index.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELS
        value: openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.6-27b
